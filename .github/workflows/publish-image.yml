name: Publish image to Quay

# Builds and pushes the container image on every `v*` tag push, alongside the
# PyPI release in publish.yml. Before the first release, create a robot
# account in the cellgeni Quay organization with write access to the
# validate-hierarchy repository, then add its credentials as repo secrets:
#   QUAY_USERNAME | QUAY_PASSWORD
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE: quay.io/cellgeni/validate-hierarchy

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(uv version --short)"
          if [ "$tag" != "$project" ]; then
            echo "::error::Tag v$tag does not match pyproject version $project"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Determine image tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${version}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
