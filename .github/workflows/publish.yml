name: Publish to PyPI

# Publishes on every `v*` tag push. Uses PyPI Trusted Publishing (OIDC), so no
# API token needs to be stored in repository secrets. Before the first release,
# add a trusted publisher on PyPI for:
#   owner: cellgeni | repo: validate-hierarchy
#   workflow: publish.yml | environment: pypi
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(uv version --short)"
          if [ "$tag" != "$project" ]; then
            echo "::error::Tag v$tag does not match pyproject version $project"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
