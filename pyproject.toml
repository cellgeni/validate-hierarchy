[project]
name = "validate-hierarchy"
version = "0.1.2"
description = "Validate directory and iRODS collection hierarchies against a declarative YAML schema"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.4",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
irods = ["python-irodsclient>=3.2.0"]

[project.scripts]
validate-hierarchy = "validate_hierarchy.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"
